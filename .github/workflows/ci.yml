name: CI
# agent-app-contract — one gate, run once.
#
# This repo deploys nothing (ADR-0004), so CI is the only feedback loop that
# exists between a wrong spec and a downstream outage. That argues for the checks
# being thorough, not for them being spread across eight runners: the previous
# layout paid for five separate `npm ci` installs to run five sequences of a few
# seconds each. Same checks, one machine, one install.
#
# What each step is for, and why none of them is decoration:
#   lint/typecheck/test  — the ordinary floor
#   spec                 — schemas are the source of truth (ADR-0003); also enforces
#                          the frozen $id prefix and open additionalProperties, so an
#                          $id typo cannot reach a tag on review attention alone
#   types-drift          — generated types are committed; they can never silently lag
#   loop                 — THE core invariant (ADR-0005): the reference agent and the
#                          harness certify each other over real HTTP
#   consume              — the deploy-leg substitute (ADR-0004 Amendment 1): proves a
#                          downstream repo can actually install and import this one
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Root `prepare` builds every workspace, so this also produces the dist/ that
      # the loop and consume steps below exercise.
      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate examples against schemas
        run: npm run validate:examples

      - name: Regenerate types
        run: npm run gen

      - name: Fail on type drift
        run: |
          # `git status --porcelain` rather than `git diff`: a NEW schema produces a
          # NEW generated file, which is untracked, and `git diff` does not see
          # untracked files at all. Using diff alone would let an added shape ship
          # with no committed types.
          DRIFT="$(git status --porcelain -- packages/types/src/generated)"
          if [ -n "$DRIFT" ]; then
            echo "::error::Generated types are stale. Run 'npm run gen' and commit the result."
            echo "$DRIFT"
            git diff -- packages/types/src/generated
            exit 1
          fi
          echo "types are in sync with schemas"

      # Red here means the schema, the reference implementation, and the harness
      # disagree — always a real defect in one of the three, never something to fix
      # by relaxing the harness.
      - name: Self-proving loop
        run: npm run loop

      - name: Consumability
        run: npm run verify:consume

  secret-scan:
    # Kept separate: it is the one job that needs full history, and it must not be
    # skipped because an unrelated lint error failed the job above it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
